name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install busybox
        run: sudo apt-get update && sudo apt-get install -y busybox
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      # TestStartWrapper only logs when busybox is missing: fail here
      # unless its busybox subtest ran and passed.
      - name: start wrapper under busybox sh
        run: |
          go test -count=1 -run 'TestStartWrapper/busybox' -v ./internal/config | tee "$RUNNER_TEMP/busybox.log"
          grep -q -- '--- PASS: TestStartWrapper/busybox' "$RUNNER_TEMP/busybox.log"
  mux-norace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: mux without race instrumentation
        run: go test -count=2 -timeout 300s ./internal/mux
