name: Default image

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['images/**', '.github/workflows/image.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One job per architecture on its native runner (no QEMU). Every event
  # builds and smoke-tests; a v* tag also pushes the image by digest, which
  # the merge job assembles into the tagged multi-arch manifest.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == tag && "$REF_NAME" == v* ]]; then
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=latest" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: images/default
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: luxmux-smoke:local
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max
      # No --user: lux runs the image's USER, so the smoke test does too.
      - name: Smoke test (image USER, empty home, no network or credentials)
        run: |
          docker run --rm --network none \
            --tmpfs /home/agent:uid=1000,gid=1000,mode=0700 \
            -v "$PWD/images/default/smoke.sh:/smoke.sh:ro" \
            luxmux-smoke:local sh /smoke.sh
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish architecture digest
        if: startsWith(github.ref, 'refs/tags/v')
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: images/default
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/marcioapm/luxmux,push-by-digest=true,name-canonical=true,push=true
          build-args: VERSION=${{ steps.version.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
      - name: Export digest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  merge:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge manifests
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tags=(-t ghcr.io/marcioapm/luxmux:latest)
          if [[ "$REF_TYPE" == tag && "$REF_NAME" == v* ]]; then
            tags+=(-t "ghcr.io/marcioapm/luxmux:${REF_NAME#v}")
          else
            echo "publishing needs a v* tag ref" >&2
            exit 1
          fi
          digests=()
          for digest in digests/*; do
            digests+=("ghcr.io/marcioapm/luxmux@sha256:${digest##*/}")
          done
          docker buildx imagetools create "${tags[@]}" "${digests[@]}"
