# System-wide, so a restored /home/agent volume cannot shadow it.
# Storage is left at Podman's default: native overlay on the ephemeral volume
# lux mounts at ~/.local/share/containers.
[engine]
# `docker compose` and `podman compose` run podman-compose, which drives the
# podman CLI directly: no API socket or service needed.
compose_providers = ["/usr/bin/podman-compose"]
compose_warning_logs = false
